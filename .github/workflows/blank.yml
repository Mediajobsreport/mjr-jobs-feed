name: MJR Jobs Feed

on:
  workflow_dispatch:
    inputs:
      test_companies:
        description: "Optional: company name(s) to test, comma-separated. Leave blank for full production crawl."
        required: false
        default: ""

  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Set run mode
        shell: bash
        run: |
          TEST="${{ github.event.inputs.test_companies }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "$TEST" ]]; then
            echo "MJR_TEST_MODE=true" >> "$GITHUB_ENV"
            echo "MJR_OUTPUT=mjr-jboard-test.xml" >> "$GITHUB_ENV"
            echo "MJR_AUDIT=mjr-ats-audit-test.csv" >> "$GITHUB_ENV"
            echo "MJR_STATE=mjr-job-state-test.json" >> "$GITHUB_ENV"
            echo "MJR_DIAGNOSTIC=mjr-salem-diagnostic.txt" >> "$GITHUB_ENV"
            echo "TARGETED TEST: $TEST"
          else
            echo "MJR_TEST_MODE=false" >> "$GITHUB_ENV"
            echo "MJR_OUTPUT=mjr-jboard-master.xml" >> "$GITHUB_ENV"
            echo "MJR_AUDIT=mjr-ats-audit.csv" >> "$GITHUB_ENV"
            echo "MJR_STATE=mjr-job-state.json" >> "$GITHUB_ENV"
            echo "MJR_DIAGNOSTIC=mjr-salem-diagnostic.txt" >> "$GITHUB_ENV"
            echo "FULL PRODUCTION CRAWL"
          fi

      - name: Crawl ATS sources
        env:
          MJR_WINDOW_DAYS: "21"
          MJR_SOURCES: "mjr-ats-sources.csv"
          MJR_TEST_COMPANIES: "${{ github.event.inputs.test_companies }}"
          MJR_REQUEST_DELAY_MIN: "0.20"
          MJR_REQUEST_DELAY_MAX: "0.65"
          MJR_DOMAIN_REQUEST_CAP: "175"
        run: python mjr-ats-crawler.py

      - name: Ensure diagnostic exists
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test_companies != '' }}
        shell: bash
        run: |
          if [[ ! -f "mjr-salem-diagnostic.txt" ]]; then
            {
              echo "MJR SALEM DIAGNOSTIC"
              echo "Diagnostic file was NOT created by the crawler."
              echo "Requested test companies: ${{ github.event.inputs.test_companies }}"
            } > mjr-salem-diagnostic.txt
          fi

      - name: Print targeted test results
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test_companies != '' }}
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "MJR TARGETED TEST"
          echo "Companies: ${{ github.event.inputs.test_companies }}"
          echo "========================================"
          echo ""
          echo "----- AUDIT -----"
          if [[ -f "mjr-ats-audit-test.csv" ]]; then
            cat mjr-ats-audit-test.csv
          else
            echo "Audit file missing."
          fi
          echo ""
          echo "----- SALEM DIAGNOSTIC -----"
          cat mjr-salem-diagnostic.txt
          echo ""
          echo "----- SALEM IFRAME HTML PREVIEW -----"
          if [[ -f "mjr-salem-iframe.html" ]]; then
            head -c 12000 mjr-salem-iframe.html
            echo ""
          else
            echo "No Salem iframe HTML file generated."
          fi
          echo ""
          echo "----- AUDACY DIAGNOSTIC -----"
          if [[ -f "mjr-audacy-diagnostic.txt" ]]; then
            cat mjr-audacy-diagnostic.txt
          else
            echo "No Audacy diagnostic file generated."
          fi
          echo ""
          echo "========================================"

      - name: Validate XML
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          output = os.environ["MJR_OUTPUT"]
          test_mode = os.environ.get("MJR_TEST_MODE", "false").lower() == "true"

          root = ET.parse(output).getroot()
          jobs = root.findall("./job")

          if not jobs and not test_mode:
              raise AssertionError("No jobs generated in production crawl")

          for job in jobs:
              expiration = job.findtext("expiration") or ""
              assert expiration.isdigit(), (
                  f"Invalid expiration for {job.findtext('title')}: {expiration}"
              )

          print(
              f"{'Targeted test' if test_mode else 'Production feed'} "
              f"validated: {len(jobs)} jobs"
          )
          PY

      - name: Upload targeted test files
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test_companies != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mjr-targeted-test-results-${{ github.run_number }}
          path: |
            mjr-jboard-test.xml
            mjr-ats-audit-test.csv
            mjr-audacy-validation-v49.txt
            mjr-job-state-test.json
            mjr-salem-diagnostic.txt
            mjr-salem-iframe.html
            mjr-audacy-diagnostic.txt
            mjr-audacy-raw-response.txt
            mjr-audacy-search-page-v43.html
            mjr-audacy-detail-diagnostic-v45.txt
            mjr-audacy-detail-*-v45.html
            mjr-audacy-frames/
          if-no-files-found: warn
          retention-days: 7

      - name: Commit updated production feed
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.test_companies != '') }}
        run: |
          git config user.name "MJR Jobs Bot"
          git config user.email "actions@users.noreply.github.com"

          git add mjr-jboard-master.xml mjr-ats-audit.csv mjr-job-state.json

          if git diff --cached --quiet; then
            echo "No feed changes to commit."
          else
            git commit -m "Update MJR jobs feed"
            git pull --rebase origin main
            git push origin main
          fi
