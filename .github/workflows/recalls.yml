name: Build MJR Recall Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

# Serialize all workflows that write to main in this repository.
# This avoids non-fast-forward push failures when the jobs feed or another
# scheduled writer commits while the recall feed is running.
concurrency:
  group: mjr-main-writer
  cancel-in-progress: false

jobs:
  build-recalls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Sync checkout to latest main
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install recall dependencies
        working-directory: recalls
        run: npm install
      - name: Build recall feed
        working-directory: recalls
        run: npm run build
      - name: Show feed summary
        run: |
          node -e "const f=require('./data/mjr-recalls.json'); console.log('Generated:',f.generated); console.log('Newest:',f.newestDate); console.log('Total:',f.count); console.log('Sources:',f.sources); f.items.slice(0,15).forEach((x,i)=>console.log((i+1)+'.',x.source,x.date,x.score,x.title));"
      - name: Commit updated recall feed
        run: |
          git config user.name "MJR Recall Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/mjr-recalls.json recalls/package-lock.json
          if git diff --cached --quiet; then
            echo "No recall changes."
          else
            git commit -m "Update MJR recall feed"

            # A different writer may still have updated main after this run began.
            # Rebase our single generated-file commit onto the newest main and retry.
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main; then
                if git push origin main; then
                  exit 0
                fi
              else
                git rebase --abort || true
                echo "Recall feed rebase conflicted; regenerating from latest main is safer."
                exit 1
              fi
              echo "Push race on attempt $attempt; retrying..."
              sleep $((attempt * 5))
            done

            echo "Unable to publish recall feed after 3 attempts."
            exit 1
          fi
